<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mary – Menú Principal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;
    background:linear-gradient(180deg,#0a0518 0%,#1a0a2e 50%,#0a0518 100%);
    font-family:'Press Start 2P',monospace;
    overflow:hidden;touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
    color:#fff;
  }
  #root{
    width:100vw;height:100vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:20px 14px;
    overflow-y:auto;
  }
  .title{
    color:#f4c542;
    font-size:clamp(18px,5vw,28px);
    text-align:center;
    text-shadow:4px 4px 0 #7a3f00;
    margin-bottom:8px;
    line-height:1.5;
  }
  .subtitle{
    color:#c8a8e0;
    font-size:clamp(7px,1.8vw,9px);
    text-align:center;
    margin-bottom:30px;
    letter-spacing:2px;
    line-height:1.8;
  }
  .menu-btn{
    background:linear-gradient(135deg,rgba(244,197,66,.08) 0%,rgba(244,197,66,.02) 100%);
    border:2px solid rgba(244,197,66,.4);
    color:#f4c542;
    padding:14px 18px;
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    cursor:pointer;
    border-radius:8px;
    transition:all .15s;
    display:flex;align-items:center;justify-content:center;gap:14px;
    text-align:center;
    position:relative;
    overflow:hidden;
    width:100%;max-width:380px;
    margin:6px 0;
  }
  .menu-btn:active{
    background:rgba(244,197,66,.25);
    transform:scale(.98);
  }
  .footer{
    margin-top:30px;
    color:#5a4878;
    font-size:6px;
    text-align:center;
    line-height:2;
  }
  .rain{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;opacity:.3;}
</style>
</head>
<body>
<canvas class="rain" id="rainCanvas"></canvas>

<div id="root">
  <div class="title">MARY</div>
  <div class="subtitle">EL CAMINO A CASA</div>

  <div style="width:100%;max-width:380px;">
    <div class="menu-btn" onclick="location.href='index.html'">▶ JUGAR</div>
    <div class="menu-btn" onclick="location.href='options.html'">⚙ OPCIONES</div>
    <div class="menu-btn" onclick="location.href='credits.html'">★ CRÉDITOS</div>
  </div>

  <div class="footer">
    UN JUEGO DE PIXEL ART<br>
    INSPIRADO EN UNA HISTORIA DE GUERRA<br><br>
    ✦ VERSIÓN 1.0 ✦
  </div>
</div>

<script>
// Lluvia decorativa
const rc=document.getElementById('rainCanvas');
const rctx=rc.getContext('2d');
function rzr(){rc.width=window.innerWidth;rc.height=window.innerHeight;}
rzr();window.addEventListener('resize',rzr);
const drops=[];
for(let i=0;i<80;i++) drops.push({x:Math.random()*rc.width,y:Math.random()*rc.height,l:5+Math.random()*8,s:5+Math.random()*5});
function rainLoop(){
  rctx.clearRect(0,0,rc.width,rc.height);
  rctx.strokeStyle='rgba(150,120,200,.4)';rctx.lineWidth=1;
  drops.forEach(d=>{
    rctx.beginPath();rctx.moveTo(d.x,d.y);rctx.lineTo(d.x-2,d.y+d.l);rctx.stroke();
    d.y+=d.s;d.x-=.8;
    if(d.y>rc.height){d.y=-d.l;d.x=Math.random()*rc.width;}
    if(d.x<-5)d.x=rc.width+5;
  });
  requestAnimationFrame(rainLoop);
}
rainLoop();
</script>
</body>
</html>
